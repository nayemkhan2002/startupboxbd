<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assign Investments — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/admin.css">
  <link rel="stylesheet" href="/assets/css/investor.css">
</head>
<body>
  <div class="admin-wrapper">
    <aside class="admin-sidebar">
      <div>
        <a href="/admin/dashboard.html" class="brand brand-logo" aria-label="Startup Box Bangladesh Admin">
          <img src="/logo/573511680_122109541731029651_7139585141034658401_n.jpg" alt="" class="brand-logo-img">
          <span class="brand-logo-stack">
            <span class="brand-logo-text"><span class="brand-logo-light">Startup</span><span class="brand-logo-accent">Boxbd</span></span>
            <span class="brand-text">ADMIN</span>
          </span>
        </a>
        <nav class="admin-nav">
          <a href="/admin/dashboard.html"><span class="nav-icon">▣</span> Dashboard</a>
          <a href="/admin/projects.html"><span class="nav-icon">◎</span> Projects</a>
          <a href="/admin/payouts.html"><span class="nav-icon">💰</span> Profit Payouts</a>
          <a href="/admin/investments.html" class="active"><span class="nav-icon">◈</span> Investments</a>
          <a href="/admin/withdrawals.html"><span class="nav-icon">⇄</span> Withdrawals</a>
          <a href="/admin/investor-list.html"><span class="nav-icon">👥</span> Investors</a>
          <a href="/admin/investors.html"><span class="nav-icon">◉</span> Interests</a>
        </nav>
      </div>
      <div class="admin-sidebar-footer">
        <button id="logout-btn" class="btn btn-outline btn-block btn-sm">Logout</button>
      </div>
    </aside>

    <main class="admin-main-content">
      <div class="admin-page-header">
        <div class="flex gap-2" style="align-items:flex-start;">
          <button type="button" class="sidebar-toggle" data-sidebar-toggle aria-label="Menu">☰</button>
          <div>
            <h2>Investments</h2>
            <p>Manually assign investments to investors. Investors cannot self-fund.</p>
          </div>
        </div>
        <button class="btn" id="assign-btn">+ Assign Investment</button>
      </div>

      <div class="panel">
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th>Investor</th>
                <th>Project</th>
                <th>Amount</th>
                <th>Shares</th>
                <th>Expected Return</th>
                <th>Earned</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="investments-table"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <div class="modal" id="assign-modal">
    <div class="modal-content">
      <h3 id="modal-title" style="margin-bottom:18px;">Assign Investment</h3>
      <div id="error-msg" class="error-msg"></div>
      <form id="assign-form">
        <input type="hidden" id="investment-id">
        <div class="form-group">
          <label>Investor</label>
          <select id="investorId" class="form-control" required></select>
        </div>
        <div class="form-group">
          <label>Project</label>
          <select id="projectId" class="form-control" required></select>
        </div>
        <div class="form-group" style="display:flex;gap:12px;flex-wrap:wrap;">
          <div style="flex:1;min-width:140px;">
            <label>Amount (৳)</label>
            <input type="number" id="amount" class="form-control" required min="1">
          </div>
          <div style="flex:1;min-width:140px;">
            <label>Shares Count</label>
            <input type="number" id="sharesCount" class="form-control" placeholder="e.g. 100" min="0">
          </div>
        </div>
        <div class="form-group" style="display:flex;gap:12px;flex-wrap:wrap;">
          <div style="flex:1;min-width:140px;">
            <label>Duration (months)</label>
            <input type="number" id="duration" class="form-control" required min="1" placeholder="e.g. 24">
          </div>
          <div style="flex:1;min-width:140px;">
            <label>Start Date</label>
            <input type="date" id="startDate" class="form-control" required>
          </div>
        </div>
        <div class="form-group" style="display:flex;gap:12px;flex-wrap:wrap;">
          <div style="flex:1;min-width:140px;">
            <label>Status</label>
            <select id="status" class="form-control">
              <option value="active">Active</option>
              <option value="pending">Pending</option>
              <option value="completed">Completed</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
          <div style="flex:1;min-width:140px;">
            <label>Return Earned (৳)</label>
            <input type="number" id="returnEarned" class="form-control" min="0" value="0">
          </div>
        </div>
        <div class="form-group">
          <label>Notes (optional)</label>
          <textarea id="notes" class="form-control" rows="2"></textarea>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:10px;">
          <button type="button" class="btn btn-outline" id="cancel-btn">Cancel</button>
          <button type="submit" class="btn" id="save-btn">Save Investment</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/investor.js"></script>
  <script>
    let allInvestments = [];

    const loadTable = async () => {
      allInvestments = await apiFetch('/investments');
      const tbody = document.getElementById('investments-table');
      if (!allInvestments.length) {
        tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state"><h3>No investments assigned</h3></div></td></tr>`;
        return;
      }
      tbody.innerHTML = allInvestments.map((i) => `
        <tr>
          <td><strong>${escapeHtml(i.investor?.name || '—')}</strong><br><small class="text-muted">${escapeHtml(i.investor?.email || '')}</small></td>
          <td>${escapeHtml(i.project?.title || '—')}</td>
          <td>${formatMoney(i.amount)}</td>
          <td><strong>${i.sharesCount ? Number(i.sharesCount).toLocaleString() : '0'}</strong></td>
          <td class="text-success">${formatMoney(i.expectedReturn)}</td>
          <td>${formatMoney(i.returnEarned || 0)}</td>
          <td><span class="${invStatusClass(i.status)}">${escapeHtml(i.status)}</span></td>
          <td>
            <div class="action-btns">
              <button type="button" class="btn btn-outline btn-sm edit-btn" data-id="${escapeHtml(i._id)}">Edit</button>
              <button type="button" class="btn btn-danger btn-sm delete-btn" data-id="${escapeHtml(i._id)}">Delete</button>
            </div>
          </td>
        </tr>`).join('');
    };

    document.addEventListener('DOMContentLoaded', async () => {
      const user = checkAuth('admin');
      if (!user) return;
      document.getElementById('logout-btn').addEventListener('click', logout);
      initSidebarToggle('.admin-sidebar');

      const modal = document.getElementById('assign-modal');
      const form = document.getElementById('assign-form');

      const [investors, projects] = await Promise.all([
        apiFetch('/profile/investors'),
        apiFetch('/projects')
      ]);

      document.getElementById('investorId').innerHTML =
        `<option value="">Select investor</option>` +
        investors.map((i) => `<option value="${escapeHtml(i._id)}">${escapeHtml(i.name)} (${escapeHtml(i.email)})</option>`).join('');

      document.getElementById('projectId').innerHTML =
        `<option value="">Select project</option>` +
        projects.map((p) => `<option value="${escapeHtml(p._id)}">${escapeHtml(p.title)}</option>`).join('');

      document.getElementById('startDate').value = new Date().toISOString().slice(0, 10);

      await loadTable();

      document.getElementById('assign-btn').addEventListener('click', () => {
        form.reset();
        document.getElementById('investment-id').value = '';
        document.getElementById('modal-title').textContent = 'Assign Investment';
        document.getElementById('startDate').value = new Date().toISOString().slice(0, 10);
        document.getElementById('sharesCount').value = '';
        document.getElementById('returnEarned').value = 0;
        document.getElementById('investorId').disabled = false;
        document.getElementById('error-msg').style.display = 'none';
        modal.style.display = 'block';
      });

      document.getElementById('cancel-btn').addEventListener('click', () => { modal.style.display = 'none'; });
      modal.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });

      document.getElementById('investments-table').addEventListener('click', async (e) => {
        const editBtn = e.target.closest('.edit-btn');
        const deleteBtn = e.target.closest('.delete-btn');

        if (editBtn) {
          const item = allInvestments.find((i) => i._id === editBtn.dataset.id);
          if (!item) return;
          document.getElementById('investment-id').value = item._id;
          document.getElementById('investorId').value = item.investorId;
          document.getElementById('investorId').disabled = true;
          document.getElementById('projectId').value = item.projectId;
          document.getElementById('amount').value = item.amount;
          document.getElementById('sharesCount').value = item.sharesCount || '';
          document.getElementById('duration').value = item.duration || '';
          document.getElementById('startDate').value = item.startDate ? String(item.startDate).slice(0, 10) : '';
          document.getElementById('status').value = item.status;
          document.getElementById('returnEarned').value = item.returnEarned || 0;
          document.getElementById('notes').value = item.notes || '';
          document.getElementById('modal-title').textContent = 'Edit Investment';
          modal.style.display = 'block';
        }

        if (deleteBtn) {
          const ok = await confirmDialog('Remove this investment allocation?', { title: 'Delete investment?', danger: true, confirmText: 'Delete' });
          if (!ok) return;
          try {
            await apiFetch(`/investments/${deleteBtn.dataset.id}`, { method: 'DELETE' });
            showToast('Investment deleted', 'success');
            loadTable();
          } catch (err) {
            showToast(err.message, 'error');
          }
        }
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('investment-id').value;
        const btn = document.getElementById('save-btn');
        const errorDiv = document.getElementById('error-msg');
        const body = {
          investorId: document.getElementById('investorId').value,
          projectId: document.getElementById('projectId').value,
          amount: Number(document.getElementById('amount').value),
          sharesCount: Number(document.getElementById('sharesCount').value) || 0,
          duration: Number(document.getElementById('duration').value),
          startDate: document.getElementById('startDate').value,
          status: document.getElementById('status').value,
          returnEarned: Number(document.getElementById('returnEarned').value) || 0,
          notes: document.getElementById('notes').value
        };

        try {
          btn.disabled = true;
          btn.textContent = 'Saving…';
          if (id) {
            await apiFetch(`/investments/${id}`, { method: 'PUT', body: JSON.stringify(body) });
            showToast('Investment updated', 'success');
          } else {
            await apiFetch('/investments', { method: 'POST', body: JSON.stringify(body) });
            showToast('Investment assigned', 'success');
          }
          modal.style.display = 'none';
          document.getElementById('investorId').disabled = false;
          loadTable();
        } catch (err) {
          errorDiv.textContent = err.message;
          errorDiv.style.display = 'block';
        } finally {
          btn.disabled = false;
          btn.textContent = 'Save Investment';
        }
      });
    });
  </script>
</body>
</html>
