<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — Startup Box Bangladesh</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
  <div class="auth-shell">
    <aside class="auth-visual">
      <a href="/" class="brand-logo" aria-label="Startup Box Bangladesh">
        <img src="/logo/573511680_122109541731029651_7139585141034658401_n.jpg" alt="" class="brand-logo-img">
        <span class="brand-logo-text"><span class="brand-logo-light">Startup</span><span class="brand-logo-accent">Boxbd</span></span>
      </a>
      <div>
        <h2>Account Security & Recovery</h2>
        <p>Enter your email address to receive a secure link to recover and reset your password.</p>
      </div>
      <p style="font-size:0.85rem;color:rgba(255,255,255,0.4);">Secure, encrypted session</p>
    </aside>

    <main class="auth-panel">
      <div class="auth-card">
        <h1>Reset your password</h1>
        <p class="auth-lead">We'll send you an email with instructions to set a new password.</p>
        
        <div id="error-msg" class="error-msg" style="display:none; background:rgba(220,38,38,0.12); color:#f87171; border:1px solid rgba(220,38,38,0.2); padding:12px; border-radius:8px; margin-bottom:16px; font-size:0.9rem;"></div>
        <div id="success-msg" style="display:none; background:rgba(21,128,61,0.12); color:#4ade80; border:1px solid rgba(21,128,61,0.2); padding:16px; border-radius:8px; margin-bottom:16px; font-size:0.9rem; line-height:1.5;"></div>

        <form id="forgot-form">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" class="form-control" placeholder="you@example.com" required autocomplete="email">
          </div>
          <button type="submit" class="btn btn-block" id="btn-submit">Send Reset Link</button>
        </form>

        <p class="auth-footer-link" style="margin-top:22px;">
          Remembered your password? <a href="/login.html">Login here</a>
        </p>
        <p class="auth-footer-link" style="margin-top:10px;"><a href="/">← Back to home</a></p>
      </div>
    </main>
  </div>

  <script src="/assets/js/api.js"></script>
  <script>
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const errorDiv = document.getElementById('error-msg');
      const successDiv = document.getElementById('success-msg');
      const btn = document.getElementById('btn-submit');

      errorDiv.style.display = 'none';
      successDiv.style.display = 'none';

      try {
        btn.disabled = true;
        btn.textContent = 'Sending link…';

        const data = await apiFetch('/auth/forgot-password', {
          method: 'POST',
          body: JSON.stringify({ email })
        });

        successDiv.textContent = data.message || 'Check your inbox for password reset instructions.';
        successDiv.style.display = 'block';
        
        // Hide the form on success
        document.getElementById('forgot-form').style.display = 'none';
      } catch (err) {
        errorDiv.textContent = err.message;
        errorDiv.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
      }
    });
  </script>
</body>
</html>
