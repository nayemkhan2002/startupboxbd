<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Investment Details — Startup Box BD</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/investor.css">
</head>
<body>
  <div class="app-shell">
    <aside class="app-sidebar">
      <a href="/investor/dashboard.html" class="brand-logo" aria-label="Startup Box Bangladesh"><img src="/logo/573511680_122109541731029651_7139585141034658401_n.jpg" alt="" class="brand-logo-img"><span class="brand-logo-text"><span class="brand-logo-light">Startup</span><span class="brand-logo-accent">Boxbd</span></span></a>
      <nav class="app-nav" id="app-nav"></nav>
      <div class="app-sidebar-footer">
        <button type="button" class="btn btn-outline btn-block btn-sm" id="logout-btn">Logout</button>
      </div>
    </aside>

    <div class="app-main">
      <header class="app-topbar">
        <div class="flex gap-2" style="align-items:center;">
          <button type="button" class="sidebar-toggle" data-sidebar-toggle aria-label="Menu">☰</button>
          <div>
            <h1>Investment Details</h1>
            <p class="welcome"><a href="/investor/investments.html" style="color:var(--text-muted);">← Back to portfolio</a></p>
          </div>
        </div>
        <div class="topbar-actions"><div class="avatar" id="user-avatar">I</div></div>
      </header>

      <main class="app-content" id="content">
        <div class="panel panel-body">
          <div class="skeleton skeleton-line lg"></div>
          <div class="skeleton skeleton-line"></div>
          <p class="text-muted mt-2">Loading investment…</p>
        </div>
      </main>
    </div>
  </div>
  <div id="bottom-nav"></div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/investor.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = checkAuth('investor');
      if (!user) return;
      document.getElementById('app-nav').innerHTML = investorNav('investments');
      document.getElementById('bottom-nav').innerHTML = investorBottomNav('investments');
      renderAvatar(document.getElementById('user-avatar'), user);
      document.getElementById('logout-btn').addEventListener('click', logout);
      initSidebarToggle('.app-sidebar');

      const id = new URLSearchParams(window.location.search).get('id');
      if (!id) {
        window.location.href = '/investor/investments.html';
        return;
      }

      try {
        const inv = await apiFetch(`/investments/${id}`);
        const totalExpected = Number(inv.amount || 0) + Number(inv.expectedReturn || 0);
        const earned = Number(inv.returnEarned) || (inv.status === 'completed' ? Number(inv.expectedReturn) : 0);

        document.getElementById('content').innerHTML = `
          <div class="mb-3 flex-between" style="flex-wrap:wrap;gap:12px;">
            <div>
              <span class="badge">${escapeHtml(inv.project?.category || 'Investment')}</span>
              <h1 style="font-size:1.7rem;color:var(--navy);margin:10px 0 6px;">${escapeHtml(inv.project?.title || 'Project')}</h1>
              <span class="${invStatusClass(inv.status)}">${escapeHtml(inv.status)}</span>
            </div>
          </div>

          <div class="detail-layout">
            <div>
              ${inv.project?.thumbnail ? `<img class="detail-banner" src="${escapeHtml(inv.project.thumbnail)}" alt="">` : ''}

              <div class="panel mt-2">
                <div class="panel-header"><h2>Project Information</h2></div>
                <div class="panel-body">
                  <p style="white-space:pre-line;color:var(--text-secondary);line-height:1.75;">${escapeHtml(inv.project?.description || 'No description available.')}</p>
                  ${inv.notes ? `<p class="mt-2 text-muted"><strong>Admin note:</strong> ${escapeHtml(inv.notes)}</p>` : ''}
                </div>
              </div>

              <div class="panel mt-2">
                <div class="panel-header"><h2>Payment History</h2></div>
                <div class="table-wrap">
                  <table class="data-table">
                    <thead><tr><th>Date</th><th>Description</th><th>Amount</th></tr></thead>
                    <tbody>
                      ${(inv.paymentHistory || []).map((p) => `
                        <tr>
                          <td data-label="Date">${formatDate(p.date)}</td>
                          <td data-label="Description">${escapeHtml(p.label || p.type)}</td>
                          <td data-label="Amount">${formatMoney(p.amount)}</td>
                        </tr>`).join('') || '<tr><td colspan="3">No payments recorded</td></tr>'}
                    </tbody>
                  </table>
                </div>
              </div>

              <div class="panel mt-2">
                <div class="panel-header"><h2>Timeline</h2></div>
                <div class="panel-body">
                  <ul class="timeline-list">
                    ${(inv.timeline || []).map((t) => `
                      <li class="${t.done ? 'done' : ''}">
                        <div class="tl-label">${escapeHtml(t.label)}</div>
                        <div class="tl-date">${t.done ? formatDate(t.date) : 'Pending'}</div>
                      </li>`).join('')}
                  </ul>
                </div>
              </div>
            </div>

            <aside>
              <div class="summary-card">
                <h3 style="color:var(--navy);margin-bottom:16px;">Investment Summary</h3>
                <div class="summary-row"><span class="label">Initial Investment</span><span class="value text-gold">${formatMoney(inv.amount)}</span></div>
                <div class="summary-row"><span class="label">Shares Owned</span><span class="value"><strong>${inv.sharesCount ? Number(inv.sharesCount).toLocaleString() : '—'}</strong></span></div>
                <div class="summary-row"><span class="label">Expected Profit</span><span class="value text-success">${formatMoney(inv.expectedReturn)}</span></div>
                <div class="summary-row"><span class="label">Total Expected Return</span><span class="value">${formatMoney(totalExpected)}</span></div>
                <div class="summary-row"><span class="label">Return Earned</span><span class="value ${inv.profitNotAssigned || inv.returnEarned == null ? 'text-muted' : 'text-success'}">${escapeHtml(formatReturnEarned(inv))}</span></div>
                <div class="summary-row"><span class="label">Duration</span><span class="value">${escapeHtml(durationLabel(inv))}</span></div>
                <div class="summary-row"><span class="label">Start Date</span><span class="value">${formatDate(inv.startDate)}</span></div>
                <div class="summary-row"><span class="label">Maturity Date</span><span class="value">${formatDate(inv.maturityDate)}</span></div>

                <div class="mt-3 panel" style="border:none;box-shadow:none;background:var(--bg-subtle);border-radius:12px;padding:14px;">
                  <h4 style="font-size:0.95rem;color:var(--navy);margin-bottom:8px;">Investment Breakdown</h4>
                  <p style="font-size:0.88rem;color:var(--text-secondary);line-height:1.6;">
                    Initial Investment: <strong>${formatMoney(inv.amount)}</strong>.
                    Capital + profit at maturity ≈ <strong>${formatMoney(totalExpected)}</strong>.
                  </p>
                </div>
              </div>
            </aside>
          </div>`;
      } catch (err) {
        document.getElementById('content').innerHTML =
          `<div class="empty-state panel"><h3>Unable to load</h3><p>${escapeHtml(err.message)}</p></div>`;
      }
    });
  </script>
</body>
</html>
