<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — Startup Box BD</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/investor.css">
</head>
<body>
  <div class="app-shell">
    <aside class="app-sidebar">
      <a href="/investor/dashboard.html" class="brand-logo" aria-label="Startup Box Bangladesh"><img src="/logo/573511680_122109541731029651_7139585141034658401_n.jpg" alt="" class="brand-logo-img"><span class="brand-logo-text"><span class="brand-logo-light">Startup</span><span class="brand-logo-accent">Boxbd</span></span></a>
      <nav class="app-nav" id="app-nav"></nav>
      <div class="app-sidebar-footer">
        <button type="button" class="btn btn-outline btn-block btn-sm" id="logout-btn">Logout</button>
      </div>
    </aside>

    <div class="app-main">
      <header class="app-topbar">
        <div class="flex gap-2" style="align-items:center;">
          <button type="button" class="sidebar-toggle" data-sidebar-toggle aria-label="Menu">☰</button>
          <div>
            <h1>Profile</h1>
            <p class="welcome">Personal & banking information</p>
          </div>
        </div>
        <div class="topbar-actions"><div class="avatar" id="user-avatar">I</div></div>
      </header>

      <main class="app-content">
        <form id="profile-form">
          <div class="panel mb-3">
            <div class="panel-header"><h2>Personal Information</h2></div>
            <div class="panel-body">
              <div class="flex gap-2 mb-3" style="align-items:center;flex-wrap:wrap;">
                <div class="avatar-lg" id="profile-avatar">I</div>
                <div>
                  <label class="btn btn-outline btn-sm" style="cursor:pointer;">
                    Upload Photo
                    <input type="file" id="avatar-input" accept="image/*" hidden>
                  </label>
                  <p class="text-muted" style="font-size:0.8rem;margin-top:6px;">JPG/PNG up to 5MB</p>
                </div>
              </div>
              <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" class="form-control" required>
              </div>
              <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" class="form-control" disabled>
              </div>
              <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="phone" class="form-control" placeholder="01XXXXXXXXX">
              </div>
              <div class="form-group">
                <label>Address</label>
                <textarea id="address" class="form-control" rows="2" placeholder="Your address"></textarea>
              </div>
            </div>
          </div>

          <div class="panel mb-3">
            <div class="panel-header"><h2>Bank Information</h2></div>
            <div class="panel-body">
              <div class="form-group">
                <label>Default Withdrawal Method</label>
                <div class="radio-cards">
                  <label class="radio-card" id="method-bkash-card">
                    <input type="radio" name="defaultMethod" value="bkash">
                    <strong>bKash</strong>
                    <span>Prefer mobile wallet</span>
                  </label>
                  <label class="radio-card" id="method-bank-card">
                    <input type="radio" name="defaultMethod" value="bank">
                    <strong>Bank Account</strong>
                    <span>Prefer bank transfer</span>
                  </label>
                </div>
              </div>

              <h3 style="font-size:1rem;color:var(--navy);margin:8px 0 14px;">bKash Information</h3>
              <div class="form-group">
                <label>bKash Number</label>
                <input type="text" id="bkashNumber" class="form-control">
              </div>
              <div class="form-group">
                <label>Account Name</label>
                <input type="text" id="bkashAccountName" class="form-control">
              </div>

              <h3 style="font-size:1rem;color:var(--navy);margin:18px 0 14px;">Bank Information</h3>
              <div class="form-group">
                <label>Bank Name</label>
                <input type="text" id="bankName" class="form-control">
              </div>
              <div class="form-group">
                <label>Account Holder</label>
                <input type="text" id="accountName" class="form-control">
              </div>
              <div class="form-group">
                <label>Account Number</label>
                <input type="text" id="accountNumber" class="form-control">
              </div>
              <div class="form-group">
                <label>Branch</label>
                <input type="text" id="branch" class="form-control">
              </div>
              <div class="form-group">
                <label>Routing Number</label>
                <input type="text" id="routingNumber" class="form-control">
              </div>
            </div>
          </div>

          <button type="submit" class="btn" id="save-btn">Update Profile</button>
        </form>
      </main>
    </div>
  </div>
  <div id="bottom-nav"></div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/investor.js"></script>
  <script>
    const setMethodUI = (method) => {
      document.getElementById('method-bkash-card').classList.toggle('active', method === 'bkash');
      document.getElementById('method-bank-card').classList.toggle('active', method === 'bank');
    };

    document.addEventListener('DOMContentLoaded', async () => {
      const user = checkAuth('investor');
      if (!user) return;
      document.getElementById('app-nav').innerHTML = investorNav('profile');
      document.getElementById('bottom-nav').innerHTML = investorBottomNav('profile');
      document.getElementById('logout-btn').addEventListener('click', logout);
      initSidebarToggle('.app-sidebar');

      document.querySelectorAll('input[name="defaultMethod"]').forEach((el) => {
        el.addEventListener('change', () => setMethodUI(el.value));
      });

      try {
        const profile = await apiFetch('/profile/me');
        document.getElementById('name').value = profile.name || '';
        document.getElementById('email').value = profile.email || '';
        document.getElementById('phone').value = profile.phone || '';
        document.getElementById('address').value = profile.address || '';
        const b = profile.bankInfo || {};
        const method = b.method || 'bkash';
        document.querySelector(`input[name="defaultMethod"][value="${method}"]`).checked = true;
        setMethodUI(method);
        document.getElementById('bkashNumber').value = b.bkashNumber || '';
        document.getElementById('bkashAccountName').value = b.accountName || '';
        document.getElementById('bankName').value = b.bankName || '';
        document.getElementById('accountName').value = b.accountName || '';
        document.getElementById('accountNumber').value = b.accountNumber || '';
        document.getElementById('branch').value = b.branch || '';
        document.getElementById('routingNumber').value = b.routingNumber || '';
        renderAvatar(document.getElementById('user-avatar'), profile);
        renderAvatar(document.getElementById('profile-avatar'), profile);
        syncLocalUser(profile);
      } catch (err) {
        showToast(err.message, 'error');
      }

      document.getElementById('avatar-input').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        try {
          const fd = new FormData();
          fd.append('image', file);
          const data = await apiFetch('/profile/me/avatar', { method: 'POST', body: fd });
          syncLocalUser(data.user);
          renderAvatar(document.getElementById('user-avatar'), data.user);
          renderAvatar(document.getElementById('profile-avatar'), data.user);
          showToast('Profile photo updated', 'success');
        } catch (err) {
          showToast(err.message, 'error');
        }
      });

      document.getElementById('profile-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('save-btn');
        const method = document.querySelector('input[name="defaultMethod"]:checked').value;
        const accountName = document.getElementById('accountName').value.trim() ||
          document.getElementById('bkashAccountName').value.trim();

        try {
          btn.disabled = true;
          btn.textContent = 'Saving…';
          const updated = await apiFetch('/profile/me', {
            method: 'PUT',
            body: JSON.stringify({
              name: document.getElementById('name').value.trim(),
              phone: document.getElementById('phone').value.trim(),
              address: document.getElementById('address').value.trim(),
              bankInfo: {
                method,
                bkashNumber: document.getElementById('bkashNumber').value.trim(),
                bkashAccountType: 'Personal',
                bankName: document.getElementById('bankName').value.trim(),
                accountName,
                accountNumber: document.getElementById('accountNumber').value.trim(),
                branch: document.getElementById('branch').value.trim(),
                routingNumber: document.getElementById('routingNumber').value.trim()
              }
            })
          });
          syncLocalUser(updated);
          document.getElementById('user-name') && (document.getElementById('user-name').textContent = updated.name);
          showToast('Profile updated', 'success');
        } catch (err) {
          showToast(err.message, 'error');
        } finally {
          btn.disabled = false;
          btn.textContent = 'Update Profile';
        }
      });
    });
  </script>
</body>
</html>
