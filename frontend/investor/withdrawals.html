<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Withdrawals — Startup Box BD</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">
  <link rel="stylesheet" href="/assets/css/investor.css">
  <link rel="stylesheet" href="/assets/css/admin.css">
</head>
<body>
  <div class="app-shell">
    <aside class="app-sidebar">
      <a href="/investor/dashboard.html" class="brand-logo" aria-label="Startup Box Bangladesh"><img src="/logo/573511680_122109541731029651_7139585141034658401_n.jpg" alt="" class="brand-logo-img"><span class="brand-logo-text"><span class="brand-logo-light">Startup</span><span class="brand-logo-accent">Boxbd</span></span></a>
      <nav class="app-nav" id="app-nav"></nav>
      <div class="app-sidebar-footer">
        <button type="button" class="btn btn-outline btn-block btn-sm" id="logout-btn">Logout</button>
      </div>
    </aside>

    <div class="app-main">
      <header class="app-topbar">
        <div class="flex gap-2" style="align-items:center;">
          <button type="button" class="sidebar-toggle" data-sidebar-toggle aria-label="Menu">☰</button>
          <div>
            <h1>Withdrawal Requests</h1>
            <p class="welcome">Request payouts from earned returns</p>
          </div>
        </div>
        <div class="topbar-actions">
          <button type="button" class="btn btn-sm" id="open-withdraw-btn">Request Withdrawal</button>
          <div class="avatar" id="user-avatar">I</div>
        </div>
      </header>

      <main class="app-content">
        <div class="kpi-grid mb-3">
          <div class="kpi-card">
            <div class="kpi-label">Available Balance</div>
            <div class="kpi-value success" id="kpi-available">—</div>
            <div class="kpi-hint">Earned returns minus reserved withdrawals</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Pending Requests</div>
            <div class="kpi-value accent" id="kpi-pending">—</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Total Return Earned</div>
            <div class="kpi-value" id="kpi-earned">—</div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header"><h2>My Withdrawal Requests</h2></div>
          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Request ID</th>
                  <th>Date</th>
                  <th>Amount</th>
                  <th>Method</th>
                  <th>Status</th>
                  <th>Admin Note</th>
                </tr>
              </thead>
              <tbody id="withdrawals-table"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>
  <div id="bottom-nav"></div>

  <div class="modal" id="withdraw-modal">
    <div class="modal-content">
      <h3 style="margin-bottom:8px;">Request Money Withdrawal</h3>
      <p class="text-muted" style="margin-bottom:18px;">Available balance: <strong id="modal-available" class="text-success">৳ 0</strong></p>
      <div id="error-msg" class="error-msg"></div>
      <form id="withdraw-form">
        <div class="form-group">
          <label for="amount">Withdrawal Amount (৳)</label>
          <input type="number" id="amount" class="form-control" min="1" step="1" required placeholder="e.g. 20000">
        </div>

        <div class="form-group">
          <label>Withdrawal Method</label>
          <div class="radio-cards">
            <label class="radio-card active" id="card-bkash">
              <input type="radio" name="method" value="bkash" checked>
              <strong>bKash</strong>
              <span>Mobile wallet payout</span>
            </label>
            <label class="radio-card" id="card-bank">
              <input type="radio" name="method" value="bank">
              <strong>Bank Account</strong>
              <span>Bank transfer payout</span>
            </label>
          </div>
        </div>

        <div id="fields-bkash" class="method-fields show">
          <div class="form-group">
            <label>bKash Number</label>
            <input type="text" id="bkashNumber" class="form-control" placeholder="01XXXXXXXXX">
          </div>
          <div class="form-group">
            <label>Account Type</label>
            <select id="bkashAccountType" class="form-control">
              <option value="Personal">Personal</option>
              <option value="Agent">Agent</option>
            </select>
          </div>
          <div class="form-group">
            <label>Account Holder Name</label>
            <input type="text" id="bkashName" class="form-control" placeholder="Name on bKash">
          </div>
        </div>

        <div id="fields-bank" class="method-fields">
          <div class="form-group">
            <label>Bank Name</label>
            <input type="text" id="bankName" class="form-control" placeholder="e.g. BRAC Bank">
          </div>
          <div class="form-group">
            <label>Account Holder Name</label>
            <input type="text" id="bankAccountName" class="form-control">
          </div>
          <div class="form-group">
            <label>Account Number</label>
            <input type="text" id="accountNumber" class="form-control">
          </div>
          <div class="form-group">
            <label>Branch Name</label>
            <input type="text" id="branch" class="form-control">
          </div>
          <div class="form-group">
            <label>Routing Number</label>
            <input type="text" id="routingNumber" class="form-control">
          </div>
        </div>

        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:18px;">
          <button type="button" class="btn btn-outline" id="cancel-withdraw">Cancel</button>
          <button type="submit" class="btn" id="submit-withdraw">Send Withdrawal Request</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/investor.js"></script>
  <script>
    let availableBalance = 0;
    let profile = null;

    const toggleMethod = (method) => {
      document.getElementById('fields-bkash').classList.toggle('show', method === 'bkash');
      document.getElementById('fields-bank').classList.toggle('show', method === 'bank');
      document.getElementById('card-bkash').classList.toggle('active', method === 'bkash');
      document.getElementById('card-bank').classList.toggle('active', method === 'bank');
    };

    const prefillFromProfile = () => {
      if (!profile?.bankInfo) return;
      const b = profile.bankInfo;
      document.getElementById('bkashNumber').value = b.bkashNumber || '';
      document.getElementById('bkashAccountType').value = b.bkashAccountType || 'Personal';
      document.getElementById('bkashName').value = b.accountName || profile.name || '';
      document.getElementById('bankName').value = b.bankName || '';
      document.getElementById('bankAccountName').value = b.accountName || profile.name || '';
      document.getElementById('accountNumber').value = b.accountNumber || '';
      document.getElementById('branch').value = b.branch || '';
      document.getElementById('routingNumber').value = b.routingNumber || '';
      if (b.method === 'bank') {
        document.querySelector('input[value="bank"]').checked = true;
        toggleMethod('bank');
      }
    };

    const loadWithdrawals = async () => {
      const [stats, list] = await Promise.all([
        apiFetch('/investments/stats'),
        apiFetch('/withdrawals/my')
      ]);
      availableBalance = stats.availableBalance;
      document.getElementById('kpi-available').textContent = formatMoney(stats.availableBalance);
      document.getElementById('kpi-earned').textContent = formatMoney(stats.totalReturnEarned);
      document.getElementById('kpi-pending').textContent = formatMoney(stats.pendingWithdrawals);
      document.getElementById('modal-available').textContent = formatMoney(stats.availableBalance);

      const tbody = document.getElementById('withdrawals-table');
      if (!list.length) {
        tbody.innerHTML = `<tr><td colspan="6"><div class="empty-state" style="padding:28px;"><h3>No withdrawal requests</h3><p>Request a payout when you have available earned returns.</p></div></td></tr>`;
        return;
      }
      tbody.innerHTML = list.map((w) => `
        <tr>
          <td data-label="Request ID"><code style="font-size:0.8rem;">${escapeHtml(w._id)}</code></td>
          <td data-label="Date">${formatDate(w.createdAt)}</td>
          <td data-label="Amount" style="color:var(--gold);font-weight:700;">${formatMoney(w.amount)}</td>
          <td data-label="Method">${w.method === 'bkash' ? 'bKash' : 'Bank'}</td>
          <td data-label="Status"><span class="${wdStatusClass(w.status)}">${escapeHtml(w.status)}</span></td>
          <td data-label="Admin Note"><small>${escapeHtml(w.adminNote || '—')}</small></td>
        </tr>`).join('');
    };

    document.addEventListener('DOMContentLoaded', async () => {
      const user = checkAuth('investor');
      if (!user) return;
      document.getElementById('app-nav').innerHTML = investorNav('withdrawals');
      document.getElementById('bottom-nav').innerHTML = investorBottomNav('withdrawals');
      renderAvatar(document.getElementById('user-avatar'), user);
      document.getElementById('logout-btn').addEventListener('click', logout);
      initSidebarToggle('.app-sidebar');

      const modal = document.getElementById('withdraw-modal');
      document.getElementById('open-withdraw-btn').addEventListener('click', () => {
        document.getElementById('error-msg').style.display = 'none';
        document.getElementById('withdraw-form').reset();
        document.querySelector('input[value="bkash"]').checked = true;
        toggleMethod('bkash');
        prefillFromProfile();
        modal.style.display = 'block';
      });
      document.getElementById('cancel-withdraw').addEventListener('click', () => { modal.style.display = 'none'; });
      modal.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });

      document.querySelectorAll('input[name="method"]').forEach((el) => {
        el.addEventListener('change', () => toggleMethod(el.value));
      });

      document.getElementById('withdraw-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submit-withdraw');
        const errorDiv = document.getElementById('error-msg');
        const method = document.querySelector('input[name="method"]:checked').value;
        const amount = Number(document.getElementById('amount').value);

        const paymentInfo = method === 'bkash'
          ? {
              bkashNumber: document.getElementById('bkashNumber').value.trim(),
              bkashAccountType: document.getElementById('bkashAccountType').value,
              accountName: document.getElementById('bkashName').value.trim()
            }
          : {
              bankName: document.getElementById('bankName').value.trim(),
              accountName: document.getElementById('bankAccountName').value.trim(),
              accountNumber: document.getElementById('accountNumber').value.trim(),
              branch: document.getElementById('branch').value.trim(),
              routingNumber: document.getElementById('routingNumber').value.trim()
            };

        try {
          btn.disabled = true;
          btn.textContent = 'Submitting…';
          await apiFetch('/withdrawals', {
            method: 'POST',
            body: JSON.stringify({ amount, method, paymentInfo })
          });
          modal.style.display = 'none';
          showToast('Withdrawal request submitted', 'success');
          await loadWithdrawals();
        } catch (err) {
          errorDiv.textContent = err.message;
          errorDiv.style.display = 'block';
          showToast(err.message, 'error');
        } finally {
          btn.disabled = false;
          btn.textContent = 'Send Withdrawal Request';
        }
      });

      try {
        profile = await apiFetch('/profile/me');
        syncLocalUser(profile);
        renderAvatar(document.getElementById('user-avatar'), profile);
        await loadWithdrawals();
      } catch (err) {
        showToast(err.message, 'error');
      }
    });
  </script>
</body>
</html>
