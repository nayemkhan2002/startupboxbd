<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Startup Box Bangladesh</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
  <div class="auth-shell">
    <aside class="auth-visual">
      <a href="/" class="brand-logo" aria-label="Startup Box Bangladesh"><img src="/logo/573511680_122109541731029651_7139585141034658401_n.jpg" alt="" class="brand-logo-img"><span class="brand-logo-text"><span class="brand-logo-light">Startup</span><span class="brand-logo-accent">Boxbd</span></span></a>
      <div>
        <h2>Secure access to curated growth deals</h2>
        <p>Sign in to explore projects, express interest, and track your submissions.</p>
      </div>
      <p style="font-size:0.85rem;color:rgba(255,255,255,0.4);">Trusted by investors across Bangladesh</p>
    </aside>

    <main class="auth-panel">
      <div class="auth-card">
        <h1>Welcome back</h1>
        <p class="auth-lead">Log in to your investor or admin account.</p>
        <div id="error-msg" class="error-msg"></div>
        <form id="login-form" autocomplete="off">
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" class="form-control" placeholder="you@example.com" required autocomplete="off">
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="off">
          </div>
          <button type="submit" class="btn btn-block" id="btn-login">Login</button>
          <p class="forgot-password-link">
            <a href="/forgot-password.html">Forgot Password?</a>
          </p>
        </form>

        <p class="auth-footer-link" style="margin-top:16px;">
          Don't have an account? <a href="/register.html">Register here</a>
        </p>
        <p class="auth-footer-link" style="margin-top:10px;"><a href="/">← Back to home</a></p>
      </div>
    </main>
  </div>

  <script src="/assets/js/api.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('error-msg');
      const btn = document.getElementById('btn-login');

      try {
        btn.disabled = true;
        btn.textContent = 'Signing in…';
        const data = await apiFetch('/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password })
        });

        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data));
        showToast('Login successful', 'success');

        const nextUrl = new URLSearchParams(window.location.search).get('next');
        const defaultHome = data.role === 'admin'
          ? '/admin/dashboard.html'
          : '/investor/dashboard.html';
        let destination = defaultHome;

        if (nextUrl && nextUrl.startsWith('/') && !nextUrl.startsWith('//')) {
          if (data.role === 'investor') {
            destination = nextUrl;
          } else if (data.role === 'admin' && nextUrl.startsWith('/admin/')) {
            destination = nextUrl;
          }
        }

        window.location.href = destination;
      } catch (err) {
        errorDiv.textContent = err.message;
        errorDiv.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    });
  </script>
</body>
</html>
