<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Startup Box Bangladesh</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
  <div class="auth-shell">
    <aside class="auth-visual">
      <a href="/" class="brand-logo" aria-label="Startup Box Bangladesh">
        <img src="/logo/573511680_122109541731029651_7139585141034658401_n.jpg" alt="" class="brand-logo-img">
        <span class="brand-logo-text"><span class="brand-logo-light">Startup</span><span class="brand-logo-accent">Boxbd</span></span>
      </a>
      <div>
        <h2>Choose a secure new password</h2>
        <p>Ensure your account remains safe. Choose a strong password containing letters, numbers, and symbols.</p>
      </div>
      <p style="font-size:0.85rem;color:rgba(255,255,255,0.4);">Secure password encryption</p>
    </aside>

    <main class="auth-panel">
      <div class="auth-card">
        <h1>Set new password</h1>
        <p class="auth-lead">Please enter your new password below.</p>
        
        <div id="error-msg" class="error-msg" style="display:none; background:rgba(220,38,38,0.12); color:#f87171; border:1px solid rgba(220,38,38,0.2); padding:12px; border-radius:8px; margin-bottom:16px; font-size:0.9rem;"></div>
        <div id="success-msg" style="display:none; background:rgba(21,128,61,0.12); color:#4ade80; border:1px solid rgba(21,128,61,0.2); padding:16px; border-radius:8px; margin-bottom:16px; font-size:0.9rem; line-height:1.5;"></div>

        <form id="reset-form">
          <div class="form-group">
            <label for="password">New Password</label>
            <input type="password" id="password" class="form-control" placeholder="Min. 6 characters" required minlength="6" autocomplete="new-password">
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" class="form-control" placeholder="••••••••" required minlength="6" autocomplete="new-password">
          </div>
          <button type="submit" class="btn btn-block" id="btn-submit">Reset Password</button>
        </form>

        <p class="auth-footer-link" style="margin-top:22px; display:none;" id="login-link">
          <a href="/login.html" class="btn">Go to Login</a>
        </p>
        <p class="auth-footer-link" style="margin-top:10px;"><a href="/">← Back to home</a></p>
      </div>
    </main>
  </div>

  <script src="/assets/js/api.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    const errorDiv = document.getElementById('error-msg');
    const successDiv = document.getElementById('success-msg');
    const form = document.getElementById('reset-form');
    const btn = document.getElementById('btn-submit');
    const loginLink = document.getElementById('login-link');

    if (!token) {
      errorDiv.textContent = 'Invalid recovery token or link. Please request a new link.';
      errorDiv.style.display = 'block';
      form.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;

      errorDiv.style.display = 'none';
      successDiv.style.display = 'none';

      if (password !== confirmPassword) {
        errorDiv.textContent = 'Passwords do not match.';
        errorDiv.style.display = 'block';
        return;
      }

      try {
        btn.disabled = true;
        btn.textContent = 'Saving password…';

        const data = await apiFetch('/auth/reset-password', {
          method: 'POST',
          body: JSON.stringify({ token, password })
        });

        successDiv.textContent = data.message || 'Your password has been successfully updated.';
        successDiv.style.display = 'block';
        
        form.style.display = 'none';
        loginLink.style.display = 'block';
      } catch (err) {
        errorDiv.textContent = err.message;
        errorDiv.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Reset Password';
      }
    });
  </script>
</body>
</html>
